[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "image-registration-pipeline"
version = "0.1.0"
description = "Modular and reproducible image-registration pipeline for monomodal and multimodal benchmarking"
readme = "README.md"
requires-python = ">=3.12,<3.16"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

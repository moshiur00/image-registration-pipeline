experiment:
  name: week04_day04_ransac_affine_robustness
  seed: 42

orb:
  n_features: 800
  scale_factor: 1.2
  n_levels: 8
  edge_threshold: 31
  first_level: 0
  wta_k: 2
  score_type: harris
  patch_size: 31
  fast_threshold: 20

matching:
  strategy: knn_ratio
  minimum_matches: 8
  knn_ratio_threshold: 0.75
  maximum_distance: null
  norm: hamming
  maximum_drawn_matches: 100

ransac_affine:
  reprojection_threshold: 3.0
  confidence: 0.99
  max_trials: 3000
  refine_iterations: 10
  minimum_inliers: 8
  minimum_inlier_ratio: 0.25
  grid_rows: 4
  grid_cols: 4
  minimum_spatial_coverage: 0.125
  minimum_linearity_ratio: 0.01
  plausibility:
    min_abs_determinant: 0.10
    min_principal_scale: 0.50
    max_principal_scale: 1.80
    max_condition_number: 3.0
    max_shear_cosine: 0.65
    max_translation_fraction_of_diagonal: 1.50
    allow_reflection: false

ransac_similarity:
  reprojection_threshold: 3.0
  confidence: 0.99
  max_trials: 2000
  refine_iterations: 10
  minimum_inliers: 8
  minimum_inlier_ratio: 0.25

validation:
  tre_threshold_pixels: 3.0
  affine_linear_error_threshold: 0.05
  translation_error_threshold_pixels: 4.0

texture:
  low_gradient_energy_threshold: 0.006
  high_gradient_energy_threshold: 0.025

threshold_sweep:
  ratio_thresholds: [0.60, 0.70, 0.75, 0.80, 0.90]
  reprojection_thresholds: [1.0, 2.0, 3.0, 5.0]
  case_ids:
    - camera_affine_medium
    - camera_affine_occlusion
    - coins_affine
    - moon_affine
    - low_texture_affine
    - repeated_pattern_affine

generated_sources:
  low_texture:
    type: gaussian_blur
    base_source: camera
    sigma: 8.0
  repeated_pattern:
    type: checkerboard
    height: 512
    width: 512
    block_size: 32

sources:
  camera: data/samples/week02_real_general/camera.png
  coins: data/samples/week02_real_general/coins.png
  moon: data/samples/week02_real_general/moon.png

cases:
  - id: camera_similarity_reference
    source: camera
    ground_truth_model: similarity
    angle_degrees: 14.0
    scale_x: 1.08
    scale_y: 1.08
    shear_x: 0.0
    tx: 18.0
    ty: -14.0

  - id: camera_affine_mild
    source: camera
    ground_truth_model: affine
    angle_degrees: 8.0
    scale_x: 1.06
    scale_y: 0.96
    shear_x: 0.04
    tx: 16.0
    ty: -12.0

  - id: camera_affine_medium
    source: camera
    ground_truth_model: affine
    angle_degrees: 16.0
    scale_x: 1.12
    scale_y: 0.90
    shear_x: 0.08
    tx: 28.0
    ty: -20.0

  - id: camera_affine_occlusion
    source: camera
    ground_truth_model: affine
    angle_degrees: 12.0
    scale_x: 1.10
    scale_y: 0.94
    shear_x: 0.07
    tx: 22.0
    ty: -15.0
    postprocess:
      type: rectangular_occlusion
      area_fraction: 0.18
      fill_value: 0.0

  - id: camera_affine_partial_overlap
    source: camera
    ground_truth_model: affine
    angle_degrees: -10.0
    scale_x: 1.05
    scale_y: 0.92
    shear_x: -0.05
    tx: -42.0
    ty: 30.0
    postprocess:
      type: restricted_fov
      width_fraction: 0.68
      height_fraction: 0.74
      center_x_fraction: 0.52
      center_y_fraction: 0.48

  - id: coins_affine
    source: coins
    ground_truth_model: affine
    angle_degrees: -13.0
    scale_x: 0.95
    scale_y: 1.10
    shear_x: -0.06
    tx: 14.0
    ty: 12.0

  - id: moon_affine
    source: moon
    ground_truth_model: affine
    angle_degrees: 10.0
    scale_x: 1.07
    scale_y: 0.93
    shear_x: 0.05
    tx: 15.0
    ty: -10.0

  - id: low_texture_affine
    source: low_texture
    ground_truth_model: affine
    angle_degrees: 9.0
    scale_x: 1.06
    scale_y: 0.95
    shear_x: 0.04
    tx: 14.0
    ty: -10.0

  - id: repeated_pattern_affine
    source: repeated_pattern
    ground_truth_model: affine
    angle_degrees: 8.0
    scale_x: 1.04
    scale_y: 0.97
    shear_x: 0.03
    tx: 18.0
    ty: -14.0

output:
  directory: outputs/week04_day04_ransac_affine_robustness

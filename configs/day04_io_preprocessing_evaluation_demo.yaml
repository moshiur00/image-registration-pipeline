experiment:
  name: day04_io_preprocessing_evaluation_demo
  seed: 42

image:
  height: 240
  width: 320

known_transform:
  scale: 0.96
  angle_degrees: 7.0
  tx: 14.0
  ty: -8.0
  center_x: 160.0
  center_y: 120.0

synthetic_degradation:
  brightness_gain: 0.90
  brightness_offset: 12.0
  gaussian_noise_sigma: 3.0

preprocessing:
  grayscale: true
  clip_lower_percentile: 1.0
  clip_upper_percentile: 99.0
  normalize: true
  gaussian_sigma: 0.8
  resize: null

visualization:
  alpha: 0.5
  checkerboard_tile_size: 32

output:
  directory: outputs/day04_io_preprocessing_evaluation_demo

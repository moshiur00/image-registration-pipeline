experiment:
  week: 6
  day: 30
  name: agreement_consensus_closure
  title: Transform agreement, preliminary consensus, and Week 6 closure
runner:
  resize_shape:
  - 192
  - 192
  evaluation_mi_bins: 24
  include_optional_methods: true
  agreement_grid:
    rows: 5
    cols: 5
    margin_fraction: 0.1
  development_tre_tolerance_px: 2.0
source:
  image: data/samples/week02_real_general/camera.png
base_ground_truth:
  linear:
  - - 1.025
    - 0.035
  - - -0.025
    - 0.985
  tx: 7.0
  ty: -5.0
  centered: true
cases:
- id: day30_clean_affine
  modality_class: monomodal
  candidate_transform_models:
  - affine
  condition:
    type: none
- id: day30_blur_affine
  modality_class: monomodal
  candidate_transform_models:
  - affine
  condition:
    type: gaussian_blur
    sigma: 1.4
- id: day30_noise_affine
  modality_class: monomodal
  candidate_transform_models:
  - affine
  condition:
    type: gaussian_noise
    sigma_fraction: 0.025
    seed: 2026
- id: day30_intensity_inversion_affine
  modality_class: simulated_multimodal
  candidate_transform_models:
  - affine
  condition:
    type: intensity_inversion
methods:
- method_id: phase_translation
  display_name: Phase Correlation
  method_family: frequency_domain
  transform_model: translation
  dimensions:
  - 2
  supported_modality_classes:
  - monomodal
  requires_same_shape: true
  optional: false
  parameters:
    use_hanning_window: true
    subtract_mean: true
    interpolation: linear
- method_id: ecc_affine
  display_name: ECC Affine
  method_family: intensity_based
  transform_model: affine
  dimensions:
  - 2
  supported_modality_classes:
  - monomodal
  requires_same_shape: true
  optional: false
  parameters:
    initialization: identity
    max_iterations: 150
    epsilon: 1.0e-06
    gauss_filt_size: 5
    multiresolution: true
    pyramid_scales:
    - 0.25
    - 0.5
    - 1.0
    pre_smoothing_sigma: 0.8
    interpolation: linear
- method_id: orb_affine
  display_name: ORB + RANSAC Affine
  method_family: feature_based
  transform_model: affine
  dimensions:
  - 2
  supported_modality_classes:
  - monomodal
  requires_same_shape: false
  optional: false
  parameters:
    n_features: 800
    ratio_threshold: 0.75
    minimum_matches: 6
    reprojection_threshold: 3.0
    confidence: 0.99
    max_trials: 3000
    minimum_inliers: 6
    minimum_spatial_coverage: 0.125
    random_seed: 42
    interpolation: linear
- method_id: sift_affine
  display_name: SIFT + RANSAC Affine
  method_family: feature_based
  transform_model: affine
  dimensions:
  - 2
  supported_modality_classes:
  - monomodal
  requires_same_shape: false
  optional: true
  parameters:
    n_features: 800
    ratio_threshold: 0.75
    minimum_matches: 6
    reprojection_threshold: 3.0
    confidence: 0.99
    max_trials: 3000
    minimum_inliers: 6
    minimum_spatial_coverage: 0.125
    random_seed: 42
    interpolation: linear
- method_id: mi_affine_2d
  display_name: Mattes MI Affine 2D
  method_family: mutual_information
  transform_model: affine
  dimensions:
  - 2
  supported_modality_classes:
  - monomodal
  - simulated_multimodal
  - multimodal
  requires_same_shape: true
  optional: false
  parameters:
    initialization: geometry
    histogram_bins: 32
    sampling_strategy: none
    sampling_percentage: 1.0
    sampling_seed: 42
    learning_rate: 2.0
    minimum_step: 0.001
    number_of_iterations: 150
    relaxation_factor: 0.5
    gradient_magnitude_tolerance: 0.0001
    shrink_factors:
    - 4
    - 2
    - 1
    smoothing_sigmas:
    - 2.0
    - 1.0
    - 0.0
- method_id: mi_rigid_2d
  display_name: Mattes MI Rigid 2D
  method_family: mutual_information
  transform_model: rigid
  dimensions:
  - 2
  supported_modality_classes:
  - monomodal
  - simulated_multimodal
  - multimodal
  requires_same_shape: true
  optional: false
  parameters: {}
output:
  directory: outputs/week06_day05_agreement_consensus
  report_snapshot: reports/week06_day05_agreement_consensus.json
